events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # SPA fallback so client-side routes like /impressum work when refreshed or linked directly
            try_files $uri $uri/ /index.html;
        }
    }
}
